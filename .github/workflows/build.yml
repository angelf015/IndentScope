name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  schedule:
    # Weekly compatibility check, even when nothing is pushed.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v4

  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, lint and package
        shell: bash
        run: ./gradlew build buildPlugin verifyPluginStructure ktlintCheck --no-daemon

      - name: Check coverage
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew koverXmlReport koverHtmlReport koverVerify --no-daemon

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: IndentScope-${{ matrix.os }}
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            build/reports/kover/report.xml
            build/reports/kover/html
          if-no-files-found: error

  verify:
    name: Verify plugin compatibility
    # Verification downloads several full IDEs, so run it for releases, main
    # pushes, the weekly schedule and manual runs, but not for every pull request.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify against 2025.2, 2025.3, 2026.1, 2026.2 and Android Studio
        run: ./gradlew verifyPlugin -PverifyAndroidStudio --no-daemon
