<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 40 40" fill="none">
  <!-- Fondo Polar Night -->
  <rect width="40" height="40" rx="8" fill="#2E3440"/>
  <rect x="0.5" y="0.5" width="39" height="39" rx="7.5" stroke="#434C5E"/>
  <!-- Nivel 1: Scope externo inactivo -->
  <rect x="6" y="6" width="28" height="3" rx="1.5" fill="#4C566A"/>
  <rect x="6" y="11" width="2.5" height="18" rx="1.25" fill="#434C5E"/>
  <rect x="6" y="31" width="12" height="3" rx="1.5" fill="#4C566A"/>
  <!-- Nivel 2: Apertura y cierre del scope actual -->
  <rect x="13" y="11" width="21" height="3" rx="1.5" fill="#81A1C1"/>
  <rect x="13" y="26" width="10" height="3" rx="1.5" fill="#81A1C1"/>
  <!-- GUÍA DE INDENTACIÓN ACTIVA -->
  <rect x="13" y="16" width="2.5" height="8" rx="1.25" fill="#88C0D0"/>
  <!-- Nivel 3: Contenido del bloque interno -->
  <rect x="20" y="15.5" width="14" height="2.5" rx="1.25" fill="#B48EAD"/>
  <rect x="20" y="19" width="14" height="2.5" rx="1.25" fill="#ECEFF4"/>
  <rect x="20" y="22.5" width="11" height="2.5" rx="1.25" fill="#81A1C1" fill-opacity="0.6"/>
</svg>